# ===========================================================================
# Fabbio Bot - vhost de Nginx (host) -> reverse proxy a la app en loopback
# Pasos:
#   1) Reemplaza fabbio.TU-DOMINIO por tu dominio/subdominio real.
#   2) Reemplaza 3002 si elegiste otro APP_PORT.
#   3) Copia a /etc/nginx/sites-available/fabbio.conf y enlaza:
#        ln -s /etc/nginx/sites-available/fabbio.conf /etc/nginx/sites-enabled/
#   4) nginx -t && systemctl reload nginx
#   5) HTTPS:  certbot --nginx -d fabbio.TU-DOMINIO
# ===========================================================================
server {
    listen 80;
    listen [::]:80;
    server_name fabbio.TU-DOMINIO;

    # Notas de voz / payloads de WhatsApp
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
